name: CI

on:
  push:
    branches: [main, master, emt]
  pull_request:
    branches: [main, master, emt]

jobs:
  swift-build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift build (Tweak)
        run: |
          cd Tweak
          swift build

      - name: Swift test (Tweak)
        run: |
          cd Tweak
          swift test || echo "No tests found - continuing"

  theos-build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install ldid dpkg fakeroot

      - name: Install Theos
        run: |
          if [ ! -d "/opt/theos" ]; then
            sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
            sudo chown -R $(whoami):staff /opt/theos
          fi

      - name: Set Theos environment
        run: |
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Build with Theos
        run: |
          export THEOS=/opt/theos
          make clean
          make package

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file structure
        run: |
          echo "Repository structure:"
          ls -la
          echo "Checking for required files..."
          test -f Makefile && echo "✅ Makefile found" || echo "❌ Makefile missing"
          test -f control && echo "✅ control found" || echo "❌ control missing"
          test -d Tweak && echo "✅ Tweak directory found" || echo "❌ Tweak directory missing"

      - name: Validate control file
        run: |
          if [ -f control ]; then
            echo "Control file contents:"
            cat control
            echo "✅ Control file validation passed"
          else
            echo "❌ Control file missing"
            exit 1
          fi

      - name: Check Swift Package
        run: |
          if [ -f Tweak/Package.swift ]; then
            echo "Package.swift found:"
            head -20 Tweak/Package.swift
            echo "✅ Swift Package validation passed"
          else
            echo "❌ Package.swift missing"
            exit 1
          fi

  basic-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: File permissions check
        run: |
          echo "Checking file permissions..."
          find . -type f -name "*.sh" -exec chmod +x {} \; || true
          echo "✅ File permissions checked"

      - name: Repository health check
        run: |
          echo "Repository health check:"
          echo "- Files count: $(find . -type f | wc -l)"
          echo "- Directories count: $(find . -type d | wc -l)"
          echo "- Git status:"
          git status --porcelain || echo "No git changes"
          echo "✅ Repository health check passed"
